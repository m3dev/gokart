name: Publish

on:
  push:
    tags: '*'

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up the latest version of uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
    - name: Build and publish
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        uv build
        uv publish
