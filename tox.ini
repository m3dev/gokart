[tox]
envlist = py{311,312,313,314},ruff,pyright
skipsdist = True

[testenv]
runner = uv-venv-lock-runner
dependency_groups = test
commands =
  {envpython} -m pytest --cov=gokart --cov-report=xml -vv {posargs:}

[testenv:ruff]
dependency_groups = lint
commands =
  ruff check {posargs:}
  ruff format --check {posargs:}

[testenv:pyright]
# test is needed to resolve imports in test/.
dependency_groups =
  lint
  test
commands = pyright {posargs:}
