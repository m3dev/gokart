[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "gokart"
description="Gokart solves reproducibility, task dependencies, constraints of good code, and ease of use for Machine Learning Pipeline. [Documentation](https://gokart.readthedocs.io/en/latest/)"
authors = [
  {name = "M3, inc."}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11, <4"
dependencies = [
  "luigi>=3.8.1",  # 3.8.1+ required for ConfigPath TypedDict and OptionalParameterMixin generics
  "slack-sdk",
  "pandas>=3",
  "numpy",
  "pyarrow",
  "APScheduler",
  "dill",
  "tenacity",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]

[project.optional-dependencies]
s3 = ["boto3", "botocore>=1.35.69"]
gcs = ["google-cloud-storage>=2.18.2"]
redis = ["redis"]
# pandas is still a required dependency; the extra is added first so that users can depend on gokart[pandas] before it becomes optional (#674).
pandas = ["pandas>=3", "pyarrow"]
all = ["gokart[s3]", "gokart[gcs]", "gokart[redis]", "gokart[pandas]"]
polars = ["polars>=0.19.0"]

[project.urls]
Homepage = "https://github.com/m3dev/gokart"
Repository = "https://github.com/m3dev/gokart"
Documentation = "https://gokart.readthedocs.io/en/latest/"

[dependency-groups]
test = [
  "boto3",
  "google-cloud-storage",
  "gcp-storage-emulator",
  "fakeredis",
  "lupa",
  "matplotlib",
  "moto>=5.1.22", # for use mock_aws api
  "mypy", # for test_mypy.py, which tests the deprecated gokart.mypy plugin
  "polars>=0.19.0",
  "psutil", # imported lazily by gokart.worker
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "testfixtures",
  "boto3-stubs[s3]>=1.43.126",
  "pandas-stubs>=3.1.0.261029",
]

lint = [
  "ruff",
  "pyright[nodejs]",
]

[tool.uv]
default-groups = ['test', 'lint']
cache-keys = [ { file = "pyproject.toml" }, { git = true } ]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
enable = true

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/examples",
  "/gokart",
  "/test",
]

[tool.ruff]
line-length = 160
exclude = ["venv/*", "tox/*", "examples/*"]

[tool.ruff.lint]
# All the rules are listed on https://docs.astral.sh/ruff/rules/
extend-select = [
  "B", # bugbear
  "I", # isort
  "UP", # pyupgrade, upgrade syntax for newer versions of the language.
  "TID251", # banned-api, configured below.
  "TID253", # banned-module-level-imports, configured below.
]

# B006: Do not use mutable data structures for argument defaults. They are created during function definition time. All calls to the function reuse this one instance of that data structure, persisting changes between them.
# B008 Do not perform function calls in argument defaults.  The call is performed only once at function definition time. All calls to your function will reuse the result of that definition-time function call.  If this is intended, assign the function call to a module-level variable and use that variable as a default value.
# BLE001 / S110: the worker deliberately catches every exception raised by user code and reports it as a task failure, and the file processors catch everything to fall back to another loader.
# TRY002 / TRY004: fixing them changes the exception type users see, which belongs to a major release.
ignore = ["B006", "B008", "BLE001", "S110", "TRY002", "TRY004"]

[tool.ruff.lint.flake8-tidy-imports]
# pandas and polars are optional: import them where they are used (or under TYPE_CHECKING), so that import gokart does not need or load them.
banned-module-level-imports = ["pandas", "polars"]

# gokart talks to GCS through google-cloud-storage (gokart._gcs); google-api-python-client was dropped from the gcs extra in 2.0.0 (#685).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"googleapiclient".msg = "google-api-python-client is not a dependency of gokart; use google-cloud-storage via GCSConfig.get_storage_client()."
"luigi.contrib.gcs".msg = "luigi.contrib.gcs needs google-api-python-client, which gokart does not depend on; use gokart._gcs instead."

[tool.ruff.lint.per-file-ignores]
"test/**" = ["TID253"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
include = ["gokart", "test"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
# not part of strict
reportUnnecessaryTypeIgnoreComment = "error"

# tests legitimately reach into internals (e.g. _configured, _load_oauth_credentials) to set up and inspect state,
# and annotating every test helper parameter adds noise without catching real bugs, so the strict-only rules are turned off for tests
[[tool.pyright.executionEnvironments]]
root = "test"
extraPaths = ["."]
reportPrivateUsage = "none"
reportMissingParameterType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUntypedClassDecorator = "none"
reportUnusedClass = "none"
reportUnusedFunction = "none"

[[tool.pyright.executionEnvironments]]
root = "."

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-n auto -v"

[tool.tox]
env_list = ["py311", "py312", "py313", "py314", "ruff", "pyright"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["test"]
commands = [
  ["{env_python}", "-m", "pytest", "--cov=gokart", "--cov-report=xml", "-vv", { replace = "posargs", extend = true }],
  ["{env_python}", "-m", "coverage", "report", "--fail-under=80", "--show-missing"],
]

[tool.tox.env.ruff]
dependency_groups = ["lint"]
commands = [
  ["ruff", "check", { replace = "posargs", extend = true }],
  ["ruff", "format", "--check", { replace = "posargs", extend = true }],
]

[tool.tox.env.pyright]
# test is needed to resolve imports in test/.
dependency_groups = ["lint", "test"]
commands = [["pyright", { replace = "posargs", extend = true }]]
